name: Deploy Flask App to EC2

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # 1️⃣ Récupérer le code
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2️⃣ Configuration SSH
      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "$EC2_SSH_KEY" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H $EC2_HOST >> ~/.ssh/known_hosts
        env:
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
          EC2_HOST: ${{ secrets.EC2_HOST }}

      # 3️⃣ Copier projet vers EC2
      - name: Copy project to EC2
        run: |
          ssh -i ~/.ssh/id_rsa $EC2_USER@$EC2_HOST "mkdir -p /home/$EC2_USER/groupe9"
          scp -i ~/.ssh/id_rsa -r ./ $EC2_USER@$EC2_HOST:/home/$EC2_USER/groupe9
        env:
          EC2_USER: ${{ secrets.EC2_USER }}
          EC2_HOST: ${{ secrets.EC2_HOST }}

      # 4️⃣ Préparer serveur (installer python + venv si absent)
      - name: Prepare EC2 (install python & venv)
        run: |
          ssh -i ~/.ssh/id_rsa $EC2_USER@$EC2_HOST << 'EOF'
          sudo apt update
          sudo apt install -y python3 python3-venv python3-pip
          EOF
        env:
          EC2_USER: ${{ secrets.EC2_USER }}
          EC2_HOST: ${{ secrets.EC2_HOST }}

      # 5️⃣ Installer dépendances + lancer app
      - name: Install dependencies and run app
        run: |
          ssh -i ~/.ssh/id_rsa $EC2_USER@$EC2_HOST << 'EOF'
          APP_DIR=/home/$EC2_USER/groupe9
          LOG_FILE=$APP_DIR/app.log

          cd $APP_DIR

          # Supprimer ancien venv cassé
          rm -rf venv

          # Créer environnement virtuel
          python3 -m venv venv

          # S'assurer que pip fonctionne
          venv/bin/python -m ensurepip --upgrade

          # Mettre à jour pip
          venv/bin/pip install --upgrade pip

          # Installer dépendances
          venv/bin/pip install -r requirements.txt

          # Arrêter ancienne application si elle tourne
          pkill -f "python.*app.py" || true

          # Lancer application en arrière-plan
          nohup venv/bin/python app.py > $LOG_FILE 2>&1 &

          echo "Application démarrée"
          echo "Logs disponibles ici : $LOG_FILE"
          EOF
        env:
          EC2_USER: ${{ secrets.EC2_USER }}
          EC2_HOST: ${{ secrets.EC2_HOST }}
