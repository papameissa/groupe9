name: Deploy Flask App to EC2

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup SSH
        run: |
           ssh -i ~/.ssh/id_rsa $EC2_USER@$EC2_HOST "rm -rf /home/$EC2_USER/groupe9 && mkdir -p /home/$EC2_USER/groupe9"
           scp -i ~/.ssh/id_rsa -r $(ls -A | grep -v "^\.git$" | tr '\n' ' ') $EC2_USER@$EC2_HOST:/home/$EC2_USER/groupe9/
        env:
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
          EC2_HOST: ${{ secrets.EC2_HOST }}

      - name: Copy project to EC2 (SCP)
        run: |
          ssh -i ~/.ssh/id_rsa $EC2_USER@$EC2_HOST "rm -rf /home/$EC2_USER/groupe9 && mkdir -p /home/$EC2_USER/groupe9"
          scp -i ~/.ssh/id_rsa -r  $EC2_USER@$EC2_HOST:/home/$EC2_USER/groupe9/
        env:
          EC2_USER: ${{ secrets.EC2_USER }}
          EC2_HOST: ${{ secrets.EC2_HOST }}

      - name: Install dependencies and run app
        run: |
          ssh $EC2_USER@$EC2_HOST << EOF
          cd /home/ubuntu/${{ github.repository }}
          python3 -m venv venv
          venv/bin/pip install -r requirements.txt
          nohup venv/bin/python run.py > app.log 2>&1 &
          EOF
        env:
          EC2_USER: ${{ secrets.EC2_USER }}
          EC2_HOST: ${{ secrets.EC2_HOST }}
